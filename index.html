<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta do Clima</title>

    <link rel="stylesheet" href="style.css">

    <!-- Conecta o site ao manifest do PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Ícone para dispositivos Apple -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Permite o comportamento de aplicativo no iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">

</head>

<body>

    <main class="container">

        <h1>Consulta do Clima</h1>

        <label for="cidade">Digite uma cidade:</label>

        <input
            type="text"
            id="cidade"
            placeholder="Ex.: Lages"
        >

        <button id="buscar">
            Buscar clima
        </button>

        <section id="resultado"></section>

    </main>

    <script src="script.js"></script>

</body>

</html>
